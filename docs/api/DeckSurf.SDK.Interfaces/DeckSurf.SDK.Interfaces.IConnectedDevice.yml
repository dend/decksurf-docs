- uid: DeckSurf.SDK.Interfaces.IConnectedDevice.DeviceDisconnected
  commentId: E:DeckSurf.SDK.Interfaces.IConnectedDevice.DeviceDisconnected
  id: DeviceDisconnected
  parent: DeckSurf.SDK.Interfaces.IConnectedDevice
  langs:
  - csharp
  name: DeviceDisconnected
  nameWithType: IConnectedDevice.DeviceDisconnected
  fullName: DeckSurf.SDK.Interfaces.IConnectedDevice.DeviceDisconnected
  type: Event
  assemblies:
  - DeckSurf.SDK
  namespace: DeckSurf.SDK.Interfaces
  summary: Event raised when the device is disconnected.
  remarks: >-
    After this event fires, the device should be considered unusable. Calling methods on a disconnected device may throw <xref data-throw-if-not-resolved="true" uid="System.ObjectDisposedException"></xref>.

    After this event fires, the device instance is no longer usable and should be disposed.

    To reconnect, call <xref data-throw-if-not-resolved="true" uid="DeckSurf.SDK.Core.DeviceManager.GetDeviceBySerial(System.String)"></xref> or <xref data-throw-if-not-resolved="true" uid="DeckSurf.SDK.Core.DeviceManager.GetDeviceList"></xref>

    to obtain a fresh device instance.
  syntax:
    content: event EventHandler<EventArgs> DeviceDisconnected;
    content.csharp: event EventHandler<EventArgs> DeviceDisconnected;
  exceptions: []
  monikers:
  - net10.0
