  name: IConnectedDevice
  nameWithType: DeckSurf.SDK.Interfaces.IConnectedDevice
  fullName: DeckSurf.SDK.Interfaces.IConnectedDevice
  type: Interface
  assemblies:
  - DeckSurf.SDK
  namespace: DeckSurf.SDK.Interfaces
  summary: Interface representing a connected Stream Deck device.
  remarks: >-
    Implementations of this interface are not thread-safe. Callers must synchronize access when

    invoking methods from multiple threads. In particular, <xref data-throw-if-not-resolved="true" uid="DeckSurf.SDK.Interfaces.IConnectedDevice.SetKey(System.Int32,System.Byte[],System.Boolean)"></xref>, <xref data-throw-if-not-resolved="true" uid="DeckSurf.SDK.Interfaces.IConnectedDevice.SetBrightness(System.Byte)"></xref>,

    and <xref data-throw-if-not-resolved="true" uid="DeckSurf.SDK.Interfaces.IConnectedDevice.SetKeyColor(System.Int32,DeckSurf.SDK.Models.DeviceColor)"></xref> should not be called concurrently for the same device instance.
  syntax:
    content: 'public interface IConnectedDevice : IDisposable'
    content.csharp: 'public interface IConnectedDevice : IDisposable'
  derivedClasses:
