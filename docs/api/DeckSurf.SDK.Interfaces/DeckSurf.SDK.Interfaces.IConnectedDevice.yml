- uid: DeckSurf.SDK.Interfaces.IConnectedDevice.SetKey(System.Int32,System.Byte[],System.Boolean)
  commentId: M:DeckSurf.SDK.Interfaces.IConnectedDevice.SetKey(System.Int32,System.Byte[],System.Boolean)
  id: SetKey(System.Int32,System.Byte[],System.Boolean)
  parent: DeckSurf.SDK.Interfaces.IConnectedDevice
  langs:
  - csharp
  name: SetKey(Int32, Byte[], Boolean)
  nameWithType: IConnectedDevice.SetKey(Int32, Byte[], Boolean)
  fullName: DeckSurf.SDK.Interfaces.IConnectedDevice.SetKey(Int32, Byte[], Boolean)
  type: Method
  assemblies:
  - DeckSurf.SDK
  namespace: DeckSurf.SDK.Interfaces
  summary: Sets the content of a key on a Stream Deck device.
  syntax:
    content: public void SetKey (int keyId, byte[] image, bool alreadyResized = false);
    parameters:
    - id: keyId
      type: System.Int32
      description: Numeric ID of the key that needs to be set.
    - id: image
      type: System.Byte[]
      description: Binary content of the image (supports JPEG, PNG, BMP, GIF, and other formats recognized by ImageSharp) that needs to be set on the key.
    - id: alreadyResized
      type: System.Boolean
      description: "If true, the image bytes are written to the device unmodified, so the buffer must already be encoded in the device's native <xref data-throw-if-not-resolved=\"true\" uid=\"DeckSurf.SDK.Interfaces.IConnectedDevice.KeyImageFormat\"></xref>, sized to <xref data-throw-if-not-resolved=\"true\" uid=\"DeckSurf.SDK.Interfaces.IConnectedDevice.ButtonResolution\"></xref>, and rotated per <xref data-throw-if-not-resolved=\"true\" uid=\"DeckSurf.SDK.Interfaces.IConnectedDevice.ImageRotation\"></xref>. The format is not validated in this mode: a mismatched buffer (for example, JPEG bytes sent to a BMP device such as the Stream Deck Mini) is transferred successfully, no exception is thrown, and the device firmware silently discards it, leaving the key unchanged. Produce device-ready buffers with <xref data-throw-if-not-resolved=\"true\" uid=\"DeckSurf.SDK.Util.ImageHelper.ResizeImage(System.Byte[],System.Int32,System.Int32,DeckSurf.SDK.Models.DeviceRotation,DeckSurf.SDK.Models.DeviceImageFormat)\"></xref> or <xref data-throw-if-not-resolved=\"true\" uid=\"DeckSurf.SDK.Util.ImageHelper.CreateBlankImage(System.Int32,System.Int32,DeckSurf.SDK.Models.DeviceColor,DeckSurf.SDK.Models.DeviceImageFormat)\"></xref>, or pass false to let the SDK convert the image for the connected device."
    content.csharp: public void SetKey (int keyId, byte[] image, bool alreadyResized = false);
  overload: DeckSurf.SDK.Interfaces.IConnectedDevice.SetKey*
  exceptions:
  - type: System.ObjectDisposedException
    commentId: T:System.ObjectDisposedException
    description: Thrown when the device has been disposed.
  - type: System.ArgumentOutOfRangeException
    commentId: T:System.ArgumentOutOfRangeException
    description: Thrown when <code data-dev-comment-type="paramref">keyId</code> is outside the valid button range.
  - type: System.ArgumentException
    commentId: T:System.ArgumentException
    description: Thrown when <code data-dev-comment-type="paramref">image</code> is null or empty.
  - type: DeckSurf.SDK.Exceptions.ImageProcessingException
    commentId: T:DeckSurf.SDK.Exceptions.ImageProcessingException
    description: Thrown when the image buffer is not a recognized format (only when <code data-dev-comment-type="paramref">alreadyResized</code> is false).
  - type: DeckSurf.SDK.Exceptions.DeviceCommunicationException
    commentId: T:DeckSurf.SDK.Exceptions.DeviceCommunicationException
    description: Thrown when a USB I/O failure occurs while writing the key image.
  - type: DeckSurf.SDK.Exceptions.DeviceDisconnectedException
    commentId: T:DeckSurf.SDK.Exceptions.DeviceDisconnectedException
    description: Thrown when the device is disconnected during the operation.
  modifiers.csharp:
  - public
  monikers:
  - net10.0
