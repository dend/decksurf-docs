  name: GetChoicesAsync(String, CommandArguments, CancellationToken)
  nameWithType: IDeckSurfChoiceProvider.GetChoicesAsync(String, CommandArguments, CancellationToken)
  fullName: DeckSurf.SDK.Interfaces.IDeckSurfChoiceProvider.GetChoicesAsync(String, CommandArguments, CancellationToken)
  type: Method
  assemblies:
  - DeckSurf.SDK
  namespace: DeckSurf.SDK.Interfaces
  summary: >-
    Returns the currently available choices for a parameter. Implementations

    should honor the cancellation token and return within a few seconds; when

    the backing source is unreachable, returning an empty list is preferred

    over throwing.
  syntax:
    content: public System.Threading.Tasks.Task<System.Collections.Generic.IReadOnlyList<string>> GetChoicesAsync (string parameterKey, DeckSurf.SDK.Models.CommandArguments currentValues, System.Threading.CancellationToken cancellationToken = default);
    parameters:
    - id: parameterKey
      type: System.String
      description: Key of the parameter being edited, as declared in its <xref data-throw-if-not-resolved="true" uid="DeckSurf.SDK.Models.CommandParameterAttribute"></xref>.
    - id: currentValues
      type: DeckSurf.SDK.Models.CommandArguments
      description: >-
        The values the user has entered so far for the command's other parameters.

        Providers typically need these for connection settings: which host to

        query, which credentials to use.
    - id: cancellationToken
      type: System.Threading.CancellationToken
      description: Cancellation token for the lookup.
    return:
      type: System.Threading.Tasks.Task{System.Collections.Generic.IReadOnlyList{System.String}}
      description: The available choices, in the order they should be presented. Empty when none could be determined.
    content.csharp: public System.Threading.Tasks.Task<System.Collections.Generic.IReadOnlyList<string>> GetChoicesAsync (string parameterKey, DeckSurf.SDK.Models.CommandArguments currentValues, System.Threading.CancellationToken cancellationToken = default);
