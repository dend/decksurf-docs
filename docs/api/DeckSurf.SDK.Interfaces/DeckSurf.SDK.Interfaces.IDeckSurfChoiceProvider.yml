- uid: DeckSurf.SDK.Interfaces.IDeckSurfChoiceProvider.GetChoicesAsync(System.String,DeckSurf.SDK.Models.CommandArguments,System.Threading.CancellationToken)
  commentId: M:DeckSurf.SDK.Interfaces.IDeckSurfChoiceProvider.GetChoicesAsync(System.String,DeckSurf.SDK.Models.CommandArguments,System.Threading.CancellationToken)
  id: GetChoicesAsync(System.String,DeckSurf.SDK.Models.CommandArguments,System.Threading.CancellationToken)
