  type: Class
  assemblies:
  - DeckSurf.SDK
  namespace: DeckSurf.SDK.Core
  summary: >-
    Discovers and loads DeckSurf plugins from disk. Plugin assemblies must follow the

    <code data-dev-comment-type="c">DeckSurf.Plugin.*.dll</code> naming convention and are discovered either in a

    <code data-dev-comment-type="c">plugins</code> subdirectory (scanned recursively) or directly next to the host

    executable (top level only).
  syntax:
    content: public static class PluginLoader
    content.csharp: public static class PluginLoader
