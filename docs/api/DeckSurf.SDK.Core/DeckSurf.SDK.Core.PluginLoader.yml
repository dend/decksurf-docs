- uid: DeckSurf.SDK.Core.PluginLoader.GetCommandIconPath(System.Type)
  commentId: M:DeckSurf.SDK.Core.PluginLoader.GetCommandIconPath(System.Type)
  id: GetCommandIconPath(System.Type)
  parent: DeckSurf.SDK.Core.PluginLoader
  langs:
  - csharp
  name: GetCommandIconPath(Type)
  nameWithType: PluginLoader.GetCommandIconPath(Type)
  fullName: DeckSurf.SDK.Core.PluginLoader.GetCommandIconPath(Type)
  type: Method
  assemblies:
  - DeckSurf.SDK
  namespace: DeckSurf.SDK.Core
  summary: >-
    Resolves the absolute path of a command's display icon, declared with

    <xref data-throw-if-not-resolved="true" uid="DeckSurf.SDK.Models.CommandIconAttribute"></xref>. The attribute's path is resolved

    relative to the directory containing the command's assembly, so plugins

    can ship icon files alongside their binaries.
  syntax:
    content: public static string GetCommandIconPath (Type commandType);
    parameters:
    - id: commandType
      type: System.Type
      description: The command type whose icon should be resolved.
    return:
      type: System.String
      description: >-
        The absolute path of the icon file, or <code data-dev-comment-type="c">null</code> when the command

        declares no icon or the declared file does not exist on disk.
    content.csharp: public static string GetCommandIconPath (Type commandType);
  overload: DeckSurf.SDK.Core.PluginLoader.GetCommandIconPath*
  exceptions:
  - type: System.ArgumentNullException
    commentId: T:System.ArgumentNullException
    description: Thrown when <code data-dev-comment-type="paramref">commandType</code> is null.
  modifiers.csharp:
  - public
  - static
  monikers:
  - net10.0
- uid: DeckSurf.SDK.Core.PluginLoader.GetCommandTypes(DeckSurf.SDK.Interfaces.IDeckSurfPlugin,System.Nullable{DeckSurf.SDK.Models.DeviceModel})
  commentId: M:DeckSurf.SDK.Core.PluginLoader.GetCommandTypes(DeckSurf.SDK.Interfaces.IDeckSurfPlugin,System.Nullable{DeckSurf.SDK.Models.DeviceModel})
  id: GetCommandTypes(DeckSurf.SDK.Interfaces.IDeckSurfPlugin,System.Nullable{DeckSurf.SDK.Models.DeviceModel})
  parent: DeckSurf.SDK.Core.PluginLoader
  langs:
  - csharp
  name: GetCommandTypes(IDeckSurfPlugin, Nullable<DeviceModel>)
  nameWithType: PluginLoader.GetCommandTypes(IDeckSurfPlugin, Nullable<DeviceModel>)
  fullName: DeckSurf.SDK.Core.PluginLoader.GetCommandTypes(IDeckSurfPlugin, Nullable<DeviceModel>)
  type: Method
  assemblies:
  - DeckSurf.SDK
  namespace: DeckSurf.SDK.Core
  summary: >-
    Gets the command types declared by a plugin, optionally filtered by device model

    compatibility. Commands with no <xref data-throw-if-not-resolved="true" uid="DeckSurf.SDK.Models.CompatibleWithAttribute"></xref> annotations

    are considered compatible with every model; the attribute is only needed to

    restrict a command to specific hardware. Unlike <xref data-throw-if-not-resolved="true" uid="DeckSurf.SDK.Core.PluginLoader.LoadCompatibleCommands(DeckSurf.SDK.Interfaces.IDeckSurfPlugin,DeckSurf.SDK.Models.DeviceModel,System.Action{System.String})"></xref>,

    this does not instantiate the commands, which makes it suitable for reading command

    metadata and parameter schemas without side effects.
  syntax:
    content: public static System.Collections.Generic.IReadOnlyList<Type> GetCommandTypes (DeckSurf.SDK.Interfaces.IDeckSurfPlugin plugin, DeckSurf.SDK.Models.DeviceModel? model = default);
    parameters:
    - id: plugin
      type: DeckSurf.SDK.Interfaces.IDeckSurfPlugin
      description: The plugin whose command types should be listed.
    - id: model
      type: System.Nullable{DeckSurf.SDK.Models.DeviceModel}
      description: When set, only command types compatible with this device model are returned.
    return:
      type: System.Collections.Generic.IReadOnlyList{System.Type}
      description: The command types.
    content.csharp: public static System.Collections.Generic.IReadOnlyList<Type> GetCommandTypes (DeckSurf.SDK.Interfaces.IDeckSurfPlugin plugin, DeckSurf.SDK.Models.DeviceModel? model = default);
  overload: DeckSurf.SDK.Core.PluginLoader.GetCommandTypes*
  exceptions:
  - type: System.ArgumentNullException
    commentId: T:System.ArgumentNullException
    description: Thrown when <code data-dev-comment-type="paramref">plugin</code> is null.
  modifiers.csharp:
  - public
  - static
  monikers:
  - net10.0
- uid: DeckSurf.SDK.Core.PluginLoader.LoadCompatibleCommands(DeckSurf.SDK.Interfaces.IDeckSurfPlugin,DeckSurf.SDK.Models.DeviceModel,System.Action{System.String})
  commentId: M:DeckSurf.SDK.Core.PluginLoader.LoadCompatibleCommands(DeckSurf.SDK.Interfaces.IDeckSurfPlugin,DeckSurf.SDK.Models.DeviceModel,System.Action{System.String})
  id: LoadCompatibleCommands(DeckSurf.SDK.Interfaces.IDeckSurfPlugin,DeckSurf.SDK.Models.DeviceModel,System.Action{System.String})
  parent: DeckSurf.SDK.Core.PluginLoader
  langs:
  - csharp
  name: LoadCompatibleCommands(IDeckSurfPlugin, DeviceModel, Action<String>)
  nameWithType: PluginLoader.LoadCompatibleCommands(IDeckSurfPlugin, DeviceModel, Action<String>)
  fullName: DeckSurf.SDK.Core.PluginLoader.LoadCompatibleCommands(IDeckSurfPlugin, DeviceModel, Action<String>)
  type: Method
  assemblies:
  - DeckSurf.SDK
  namespace: DeckSurf.SDK.Core
  summary: >-
    Instantiates the commands of a plugin that are compatible with a given device model,

    based on their <xref data-throw-if-not-resolved="true" uid="DeckSurf.SDK.Models.CompatibleWithAttribute"></xref> annotations.
  syntax:
    content: public static System.Collections.Generic.IReadOnlyList<DeckSurf.SDK.Interfaces.IDeckSurfCommand> LoadCompatibleCommands (DeckSurf.SDK.Interfaces.IDeckSurfPlugin plugin, DeckSurf.SDK.Models.DeviceModel model, Action<string> onWarning = default);
    parameters:
    - id: plugin
      type: DeckSurf.SDK.Interfaces.IDeckSurfPlugin
      description: The plugin whose commands should be loaded.
    - id: model
      type: DeckSurf.SDK.Models.DeviceModel
      description: The device model the commands must be compatible with.
    - id: onWarning
      type: System.Action{System.String}
      description: Optional callback invoked with a human-readable message for every command that fails to instantiate.
    return:
      type: System.Collections.Generic.IReadOnlyList{DeckSurf.SDK.Interfaces.IDeckSurfCommand}
      description: The instantiated, compatible commands.
    content.csharp: public static System.Collections.Generic.IReadOnlyList<DeckSurf.SDK.Interfaces.IDeckSurfCommand> LoadCompatibleCommands (DeckSurf.SDK.Interfaces.IDeckSurfPlugin plugin, DeckSurf.SDK.Models.DeviceModel model, Action<string> onWarning = default);
  overload: DeckSurf.SDK.Core.PluginLoader.LoadCompatibleCommands*
  exceptions:
  - type: System.ArgumentNullException
    commentId: T:System.ArgumentNullException
    description: Thrown when <code data-dev-comment-type="paramref">plugin</code> is null.
  modifiers.csharp:
  - public
  - static
  monikers:
  - net10.0
- uid: DeckSurf.SDK.Core.PluginLoader.LoadPlugins(System.String,System.Action{System.String},System.Boolean)
  commentId: M:DeckSurf.SDK.Core.PluginLoader.LoadPlugins(System.String,System.Action{System.String},System.Boolean)
  id: LoadPlugins(System.String,System.Action{System.String},System.Boolean)
  parent: DeckSurf.SDK.Core.PluginLoader
  langs:
  - csharp
  name: LoadPlugins(String, Action<String>, Boolean)
  nameWithType: PluginLoader.LoadPlugins(String, Action<String>, Boolean)
  fullName: DeckSurf.SDK.Core.PluginLoader.LoadPlugins(String, Action<String>, Boolean)
  type: Method
  assemblies:
  - DeckSurf.SDK
  namespace: DeckSurf.SDK.Core
  summary: Discovers and instantiates all plugins under the given base directory.
  syntax:
    content: public static System.Collections.Generic.IReadOnlyList<DeckSurf.SDK.Interfaces.IDeckSurfPlugin> LoadPlugins (string baseDirectory, Action<string> onWarning = default, bool scanBaseRecursively = false);
    parameters:
    - id: baseDirectory
      type: System.String
      description: >-
        Directory to scan. Both <code data-dev-comment-type="c">{baseDirectory}\plugins</code> (recursive) and

        <code data-dev-comment-type="paramref">baseDirectory</code> itself (top level, or fully recursive when

        <code data-dev-comment-type="paramref">scanBaseRecursively</code> is set) are searched; duplicate

        assembly file names are loaded only once, preferring the <code data-dev-comment-type="c">plugins</code> copy.
    - id: onWarning
      type: System.Action{System.String}
      description: Optional callback invoked with a human-readable message for every non-fatal load failure.
    - id: scanBaseRecursively
      type: System.Boolean
      description: >-
        When <code data-dev-comment-type="c">true</code>, the base directory is scanned recursively - appropriate for

        user-configured plugin folders that contain one subdirectory per plugin.
    return:
      type: System.Collections.Generic.IReadOnlyList{DeckSurf.SDK.Interfaces.IDeckSurfPlugin}
      description: The instantiated plugins. Empty when no plugin assemblies are found.
    content.csharp: public static System.Collections.Generic.IReadOnlyList<DeckSurf.SDK.Interfaces.IDeckSurfPlugin> LoadPlugins (string baseDirectory, Action<string> onWarning = default, bool scanBaseRecursively = false);
  overload: DeckSurf.SDK.Core.PluginLoader.LoadPlugins*
  exceptions:
  - type: System.ArgumentException
    commentId: T:System.ArgumentException
    description: Thrown when <code data-dev-comment-type="paramref">baseDirectory</code> is null or whitespace.
  modifiers.csharp:
  - public
  - static
  monikers:
  - net10.0
