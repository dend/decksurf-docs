- uid: DeckSurf.SDK.Core.DeviceManager.SetupDevice(DeckSurf.SDK.Models.ConfigurationProfile)
  commentId: M:DeckSurf.SDK.Core.DeviceManager.SetupDevice(DeckSurf.SDK.Models.ConfigurationProfile)
  id: SetupDevice(DeckSurf.SDK.Models.ConfigurationProfile)
  parent: DeckSurf.SDK.Core.DeviceManager
  langs:
  - csharp
  name: SetupDevice(ConfigurationProfile)
  nameWithType: DeviceManager.SetupDevice(ConfigurationProfile)
  fullName: DeckSurf.SDK.Core.DeviceManager.SetupDevice(ConfigurationProfile)
  type: Method
  assemblies:
  - DeckSurf.SDK
  namespace: DeckSurf.SDK.Core
  summary: >-
    Gets a connected Stream Deck device based on a pre-defined configuration profile.

    The method prefers matching by <xref data-throw-if-not-resolved="true" uid="DeckSurf.SDK.Models.ConfigurationProfile.DeviceSerial"></xref> (which is

    stable across re-plugs) and falls back to <xref data-throw-if-not-resolved="true" uid="DeckSurf.SDK.Models.ConfigurationProfile.DeviceIndex"></xref>

    when no serial match is found.
  syntax:
    content: public static DeckSurf.SDK.Models.ConnectedDevice SetupDevice (DeckSurf.SDK.Models.ConfigurationProfile profile);
    parameters:
    - id: profile
      type: DeckSurf.SDK.Models.ConfigurationProfile
      description: An instance representing the pre-defined configuration profile.
    return:
      type: DeckSurf.SDK.Models.ConnectedDevice
      description: The matching <xref data-throw-if-not-resolved="true" uid="DeckSurf.SDK.Models.ConnectedDevice"></xref> with its button map configured.
    content.csharp: public static DeckSurf.SDK.Models.ConnectedDevice SetupDevice (DeckSurf.SDK.Models.ConfigurationProfile profile);
  overload: DeckSurf.SDK.Core.DeviceManager.SetupDevice*
  exceptions:
  - type: DeckSurf.SDK.Exceptions.DeviceNotFoundException
    commentId: T:DeckSurf.SDK.Exceptions.DeviceNotFoundException
    description: Thrown when no device matches the serial number or index specified in <code data-dev-comment-type="paramref">profile</code>.
  modifiers.csharp:
  - public
  - static
  monikers:
  - net10.0
