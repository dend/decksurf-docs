  type: Class
  assemblies:
  - DeckSurf.SDK
  namespace: DeckSurf.SDK.Models
  summary: Abstract class representing a connected Stream Deck device. Use specific implementations for a given connected model.
  remarks: >-
    USB write operations (<xref data-throw-if-not-resolved="true" uid="DeckSurf.SDK.Models.ConnectedDevice.SetKey(System.Int32,System.Byte[],System.Boolean)"></xref>, <xref data-throw-if-not-resolved="true" uid="DeckSurf.SDK.Models.ConnectedDevice.SetBrightness(System.Byte)"></xref>,

    <xref data-throw-if-not-resolved="true" uid="DeckSurf.SDK.Models.ConnectedDevice.SetKeyColor(System.Int32,DeckSurf.SDK.Models.DeviceColor)"></xref>) are internally serialized so that multi-packet writes

    for one operation complete atomically before the next operation begins.
