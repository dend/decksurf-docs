    <ul><li>

    <xref data-throw-if-not-resolved="true" uid="DeckSurf.SDK.Models.ButtonKind.Button"></xref>: only <xref data-throw-if-not-resolved="true" uid="DeckSurf.SDK.Models.ButtonPressEventArgs.Id"></xref> and <xref data-throw-if-not-resolved="true" uid="DeckSurf.SDK.Models.ButtonPressEventArgs.EventKind"></xref> are set.</li><li>

