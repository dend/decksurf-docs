    <xref data-throw-if-not-resolved="true" uid="DeckSurf.SDK.Models.ButtonKind.Knob"></xref>: <xref data-throw-if-not-resolved="true" uid="DeckSurf.SDK.Models.ButtonPressEventArgs.IsKnobRotating"></xref> and <xref data-throw-if-not-resolved="true" uid="DeckSurf.SDK.Models.ButtonPressEventArgs.KnobRotationDirection"></xref> are also set.</li></ul>
