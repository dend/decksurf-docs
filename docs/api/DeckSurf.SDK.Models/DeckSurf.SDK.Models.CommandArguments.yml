  name: CommandArguments
  nameWithType: DeckSurf.SDK.Models.CommandArguments
  fullName: DeckSurf.SDK.Models.CommandArguments
  type: Class
  assemblies:
  - DeckSurf.SDK
  namespace: DeckSurf.SDK.Models
  summary: >-
    Immutable set of arguments passed to a command, keyed case-insensitively by

    parameter key. In profile JSON the arguments are stored as a plain object

    (<code data-dev-comment-type="c">"command_arguments": { "scene": "Gameplay" }</code>), which places no

    restrictions on the characters a key or value may contain. The legacy

    comma-separated <code data-dev-comment-type="c">key=value</code> string format is still accepted when

    reading profiles and is written back unchanged (see <xref data-throw-if-not-resolved="true" uid="DeckSurf.SDK.Models.CommandArguments.LegacyText"></xref>)

    so existing profiles round-trip losslessly until they are edited.
