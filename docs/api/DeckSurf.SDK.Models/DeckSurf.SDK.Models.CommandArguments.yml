  name: FromLegacyString(String)
  nameWithType: CommandArguments.FromLegacyString(String)
  fullName: DeckSurf.SDK.Models.CommandArguments.FromLegacyString(String)
  type: Method
  assemblies:
  - DeckSurf.SDK
  namespace: DeckSurf.SDK.Models
  summary: >-
    Parses the legacy comma-separated <code data-dev-comment-type="c">key=value</code> format. Keys and values

    are trimmed, segments without an <code data-dev-comment-type="c">=</code> become keys with empty values, and

    duplicate keys keep the last value. The raw input is preserved in

    <xref data-throw-if-not-resolved="true" uid="DeckSurf.SDK.Models.CommandArguments.LegacyText"></xref>. This format cannot represent commas in values;

    new profiles should use the JSON object form instead.
  syntax:
    content: public static DeckSurf.SDK.Models.CommandArguments FromLegacyString (string arguments);
    parameters:
    - id: arguments
      type: System.String
      description: The delimited argument string. Null and empty inputs produce <xref data-throw-if-not-resolved="true" uid="DeckSurf.SDK.Models.CommandArguments.Empty"></xref>.
    return:
      type: DeckSurf.SDK.Models.CommandArguments
      description: The parsed argument set.
    content.csharp: public static DeckSurf.SDK.Models.CommandArguments FromLegacyString (string arguments);
  overload: DeckSurf.SDK.Models.CommandArguments.FromLegacyString*
  exceptions: []
  modifiers.csharp:
  - public
  - static
  monikers:
  - net10.0
