  summary: >-
    A touch key flanking the screen (Stream Deck Neo). <xref data-throw-if-not-resolved="true" uid="DeckSurf.SDK.Models.CommandMapping.ButtonIndex"></xref>

    is the zero-based touch key index, left to right. Touch keys have no display of

    their own; their backlight is driven with

    <xref data-throw-if-not-resolved="true" uid="DeckSurf.SDK.Interfaces.IConnectedDevice.SetKeyColor(System.Int32,DeckSurf.SDK.Models.DeviceColor)"></xref> at an index offset by

    <xref data-throw-if-not-resolved="true" uid="DeckSurf.SDK.Interfaces.IConnectedDevice.ButtonCount"></xref>.
