  name: CommandParameterAttribute
  nameWithType: DeckSurf.SDK.Models.CommandParameterAttribute
  fullName: DeckSurf.SDK.Models.CommandParameterAttribute
  type: Class
  assemblies:
  - DeckSurf.SDK
  namespace: DeckSurf.SDK.Models
  summary: >-
    Declares a configurable parameter for a DeckSurf command. Parameter values are

    stored as entries of the <xref data-throw-if-not-resolved="true" uid="DeckSurf.SDK.Models.CommandMapping.CommandArguments"></xref> object and

    read with its typed accessors. Declaring parameters lets tooling (such as

    a graphical profile editor) generate configuration forms for a command without any

    command-specific knowledge.
  remarks: >-
    Commands without any <xref data-throw-if-not-resolved="true" uid="DeckSurf.SDK.Models.CommandParameterAttribute"></xref> annotations are treated as

    having no configurable parameters. Choice lists that are only known at runtime are

    declared with <xref data-throw-if-not-resolved="true" uid="DeckSurf.SDK.Models.CommandParameterAttribute.DynamicChoices"></xref> and served by the command through

    <xref data-throw-if-not-resolved="true" uid="DeckSurf.SDK.Interfaces.IDeckSurfChoiceProvider"></xref>.
  syntax:
    content: >-
      [[System.AttributeUsage(System.AttributeTargets.Class, AllowMultiple=true, Inherited=true)]]

      public sealed class CommandParameterAttribute : Attribute
    content.csharp: >-
      [[System.AttributeUsage(System.AttributeTargets.Class, AllowMultiple=true, Inherited=true)]]

      public sealed class CommandParameterAttribute : Attribute
