  type: Method
  assemblies:
  - DeckSurf.SDK
  namespace: DeckSurf.SDK.Util
  summary: >-
    Gets a value from a command arguments string by key, or returns a default value

    if the key is not present.
  syntax:
    content: public static string GetValueOrDefault (string arguments, string key, string defaultValue = "");
    parameters:
    - id: arguments
      type: System.String
      description: A comma-separated string of key=value pairs.
    - id: key
      type: System.String
      description: The key to look up.
    - id: defaultValue
      type: System.String
      description: The value to return if the key is not found. Defaults to an empty string.
    return:
      type: System.String
      description: >-
        The value associated with the specified key, or <code data-dev-comment-type="paramref">defaultValue</code> if the

        key is not found.
    content.csharp: public static string GetValueOrDefault (string arguments, string key, string defaultValue = "");
