- uid: DeckSurf.SDK.Util.CommandArgumentParser.Parse(System.String)
  commentId: M:DeckSurf.SDK.Util.CommandArgumentParser.Parse(System.String)
  id: Parse(System.String)
  parent: DeckSurf.SDK.Util.CommandArgumentParser
  langs:
  - csharp
  name: Parse(String)
  nameWithType: CommandArgumentParser.Parse(String)
  fullName: DeckSurf.SDK.Util.CommandArgumentParser.Parse(String)
  type: Method
  assemblies:
  - DeckSurf.SDK
  namespace: DeckSurf.SDK.Util
  summary: Parses a comma-separated key=value string into a read-only dictionary.
  syntax:
    content: public static System.Collections.Generic.IReadOnlyDictionary<string,string> Parse (string arguments);
    parameters:
    - id: arguments
      type: System.String
      description: >-
        A comma-separated string of key=value pairs.

        Example: "device_id=light_01,brightness=80" produces {"device_id": "light_01", "brightness": "80"}.
    return:
      type: System.Collections.Generic.IReadOnlyDictionary{System.String,System.String}
      description: >-
        A read-only dictionary of parsed key-value pairs. Returns an empty dictionary if

        <code data-dev-comment-type="paramref">arguments</code> is <code data-dev-comment-type="c">null</code> or empty. Keys missing an <code data-dev-comment-type="c">=</code> delimiter

        are stored with an empty string value. Both keys and values are trimmed of surrounding whitespace.
    content.csharp: public static System.Collections.Generic.IReadOnlyDictionary<string,string> Parse (string arguments);
  overload: DeckSurf.SDK.Util.CommandArgumentParser.Parse*
  exceptions: []
  modifiers.csharp:
  - public
  - static
  monikers:
  - net10.0
