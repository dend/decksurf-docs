    - id: width
      type: System.Int32
      description: Width in pixels.
    - id: height
      type: System.Int32
      description: Height in pixels.
    - id: color
      type: DeckSurf.SDK.Models.DeviceColor
      description: The fill color.
    - id: format
      type: DeckSurf.SDK.Models.DeviceImageFormat
      description: The output image format.
    return:
      type: System.Byte[]
      description: Byte array representing the image in the specified format.
    content.csharp: public static byte[] CreateBlankImage (int width, int height, DeckSurf.SDK.Models.DeviceColor color, DeckSurf.SDK.Models.DeviceImageFormat format);
