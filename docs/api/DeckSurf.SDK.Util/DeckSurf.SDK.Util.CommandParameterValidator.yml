  type: Method
  assemblies:
  - DeckSurf.SDK
  namespace: DeckSurf.SDK.Util
  summary: >-
    Validates parameter values against a schema. Checks that required parameters are

    present and non-empty, that numeric parameters parse and fall within their declared

    range, that boolean parameters parse, and that choice parameters use one of the

    declared values. File and folder paths are not checked for existence, since profiles

    may be shared across machines.
  syntax:
    content: public static System.Collections.Generic.IReadOnlyList<string> Validate (System.Collections.Generic.IReadOnlyList<DeckSurf.SDK.Models.CommandParameterAttribute> schema, System.Collections.Generic.IReadOnlyDictionary<string,string> values);
    parameters:
    - id: schema
      type: System.Collections.Generic.IReadOnlyList{DeckSurf.SDK.Models.CommandParameterAttribute}
      description: The declared parameters, as returned by <xref data-throw-if-not-resolved="true" uid="DeckSurf.SDK.Util.CommandSchemaReader"></xref>.
    - id: values
      type: System.Collections.Generic.IReadOnlyDictionary{System.String,System.String}
      description: The parameter values keyed by parameter key.
    return:
      type: System.Collections.Generic.IReadOnlyList{System.String}
      description: A list of human-readable validation errors. Empty when the values are valid.
    content.csharp: public static System.Collections.Generic.IReadOnlyList<string> Validate (System.Collections.Generic.IReadOnlyList<DeckSurf.SDK.Models.CommandParameterAttribute> schema, System.Collections.Generic.IReadOnlyDictionary<string,string> values);
